name: Deploy EP × Beko Sales Challenge

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'ep-beko-challenge' }}
      APP_URL: ${{ vars.APP_URL }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wrangler installieren
        run: npm install --no-save --no-audit --no-fund wrangler@4

      - name: Cloudflare-Ressourcen anlegen bzw. finden (D1, KV, Pages-Projekt)
        id: res
        run: bash scripts/ensure-resources.sh

      - name: Geheimnisse der App setzen (vor dem Veröffentlichen, damit sie sofort gelten)
        env:
          MAIL_API_TOKEN: ${{ secrets.MAIL_API_TOKEN }}
          MAIL_CRON_KEY: ${{ secrets.MAIL_CRON_KEY }}
          START_PASSWORD: ${{ secrets.START_PASSWORD }}
        run: |
          put() { if [ -n "$2" ]; then printf '%s' "$2" | npx wrangler pages secret put "$1" --project-name "$PAGES_PROJECT"; echo "Secret $1 gesetzt"; fi; }
          put CF_API_TOKEN "$MAIL_API_TOKEN"
          put CRON_KEY "$MAIL_CRON_KEY"
          put START_PASSWORD "$START_PASSWORD"

      - name: App veröffentlichen (Cloudflare Pages)
        run: npx wrangler pages deploy --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true

      - name: Zeitplan-Worker für die Wochen- und Monatsmail veröffentlichen
        if: ${{ env.MAIL_FROM != '' }}
        env:
          MAIL_CRON_KEY: ${{ secrets.MAIL_CRON_KEY }}
        working-directory: mailer
        run: |
          if [ -z "$MAIL_CRON_KEY" ]; then echo "MAIL_CRON_KEY fehlt – Zeitplan-Worker übersprungen"; exit 0; fi
          npx wrangler deploy
          printf '%s' "$MAIL_CRON_KEY" | npx wrangler secret put CRON_KEY
